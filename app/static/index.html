<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho PC · Quản lý kho và lắp ráp</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head>
<body>
<section id="login" class="login-screen">
  <div class="login-story"><div class="brand"><span class="brand-mark">K</span> KHO PC</div><div><h1>Quản lý kho<br>và lắp ráp</h1></div></div>
  <div class="login-panel"><div class="login-card"><h2>Đăng nhập</h2><form id="login-form"><label>Tên đăng nhập<input name="username" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><div id="login-error" role="alert"></div><button class="primary full" type="submit">Đăng nhập <span>→</span></button></form></div></div>
</section>
<div id="workspace" hidden>
  <aside class="sidebar"><a class="brand" href="#overview"><span class="brand-mark">K</span> KHO PC</a><div class="workspace-label">KHO NGUYÊN LIỆU & LẮP RÁP</div><nav id="nav" aria-label="Điều hướng"></nav><div class="sidebar-bottom"><span class="connection-dot"></span><div>Đã kết nối</div></div></aside>
  <div class="main"><header class="topbar"><button id="mobile-menu" aria-label="Mở menu">☰</button><span class="breadcrumb">Kho PC <b>/</b> <span id="crumb">Tổng quan</span></span><div class="user-menu"><span class="avatar" id="avatar">QL</span><div><strong id="user-name"></strong><small id="user-role"></small></div><button id="logout" title="Đăng xuất" aria-label="Đăng xuất">↪</button></div></header><main id="content"></main><footer>Kho PC <span id="sync-time"></span></footer></div>
</div>
<dialog id="editor"><div class="dialog-head"><div><span class="eyebrow" id="modal-eyebrow">CHỨNG TỪ KHO</span><h2 id="modal-title"></h2></div><button data-close="editor" aria-label="Đóng">✕</button></div><div id="modal-body"></div></dialog>
<dialog id="confirmation"><form id="confirm-form"><h2 id="confirm-title">Xác nhận thao tác</h2><p id="confirm-message"></p><label id="reason-label" hidden>Lý do<textarea name="reason" maxlength="255" rows="3"></textarea></label><div class="dialog-actions"><button type="button" data-close="confirmation">Quay lại</button><button class="primary" type="submit">Xác nhận</button></div></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
